<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Flashcards Policía Nacional</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>

  <!-- INICIO DE SESIÓN (solo si la nube está configurada) -->
  <section id="vista-login" hidden>
    <h1>Flashcards</h1>
    <p class="subtitle">Inicia sesión para sincronizar tus tarjetas en todos tus dispositivos.</p>
    <form id="form-login" class="panel">
      <label>Correo
        <input id="in-email" type="email" autocomplete="username" required>
      </label>
      <label>Contraseña
        <input id="in-pass" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" hidden></p>
      <button class="btn primario" type="submit">Entrar</button>
    </form>
  </section>

  <!-- MENÚ PRINCIPAL -->
  <section id="vista-menu" hidden>
    <h1>Flashcards</h1>
    <p class="subtitle">Policía Nacional · Escala Básica. Elige un tema.</p>
    <div id="bloques"></div>
    <p id="estado" class="estado"></p>
    <button id="btn-salir" class="btn texto" hidden>Cerrar sesión</button>
  </section>

  <!-- PANTALLA DE UN TEMA -->
  <section id="vista-tema" hidden>
    <button class="volver" id="btn-volver">‹ Temas</button>
    <h1 id="tema-titulo"></h1>
    <p class="subtitle" id="tema-bloque"></p>

    <button class="btn primario" id="btn-nueva">+ Añadir flashcard</button>

    <form id="form-card" class="panel" hidden>
      <label>Pregunta
        <textarea id="in-pregunta" rows="3" required></textarea>
      </label>
      <label>Respuesta
        <textarea id="in-respuesta" rows="5" required></textarea>
      </label>
      <div class="fila">
        <button class="btn primario" type="submit" id="btn-guardar">Guardar</button>
        <button class="btn secundario" type="button" id="btn-cancelar">Cerrar</button>
      </div>
    </form>

    <div id="lista"></div>
  </section>

</main>
<div id="aviso" class="aviso" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
